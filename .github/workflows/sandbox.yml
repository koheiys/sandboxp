name: Sandbox

run-name: Restart ${{ inputs.environment }}-${{ inputs.service }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      service:
        description: 対象サービス
        required: true
        type: choice
        options:
          - foo
          - bar
          - baz
      environment:
        description: 対象環境
        required: true
        type: choice
        options:
          - dev
          - stg

env:
  SERVICE_NAME: ${{ inputs.service }}
  DEPLOY_ENV: ${{ inputs.environment }}

jobs:
  do-sandbox:
    runs-on: ubuntu-latest
    steps:
      - name: do sandbox
        run: |
          # aaa
          ECS_SERVICE_NAME="${DEPLOY_ENV}-${SERVICE_NAME}"
          echo $ECS_SERVICE_NAME
          echo GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME
          echo GITHUB_REF_TYPE=$GITHUB_REF_TYPE
          echo github.event_name=${{ github.event_name }}
          echo github.sha=${{ github.sha }}
          echo github.ref_type=${{ github.ref_type }}
          
